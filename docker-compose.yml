version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: news_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=news_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port không expose ra ngoài — chỉ dùng nội bộ trong Docker network

  redis:
    image: redis:7-alpine
    container_name: news_redis
    # Port không expose ra ngoài — chỉ dùng nội bộ trong Docker network

  api:
    build: 
      context: ./news-aggregator-backend
      dockerfile: Dockerfile
    container_name: news_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - path: ./news-aggregator-backend/.env
        required: false
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis

  worker:
    build: 
      context: ./news-aggregator-backend
      dockerfile: Dockerfile
    container_name: news_worker
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - path: ./news-aggregator-backend/.env
        required: false
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEWS_API_URL: http://api:8000
        JOB_API_URL: http://api:8000
    container_name: news_frontend
    ports:
      - "3000:3000"
    env_file:
      - path: ./.env.local
        required: false
    environment:
      - NEWS_API_URL=http://api:8000
      - JOB_API_URL=http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
